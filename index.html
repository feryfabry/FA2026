<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Fery &amp; Alena</title>
<style>
:root{--bg:#0e0c0b;--fg:#f4ece1;--mut:#b9ab99;--acc:#e0a458;--card:#1b1714;--line:#2c2620}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
.verborgen{display:none!important}
.hero{min-height:70vh;display:flex;flex-direction:column;justify-content:flex-end;
  padding:calc(2rem + env(safe-area-inset-top,0px)) 0 3rem;
  background:linear-gradient(to top,var(--bg) 5%,rgba(14,12,11,.35) 60%,rgba(14,12,11,.7)),
  url("titel.jpg") center/cover,linear-gradient(135deg,#3a2a1c,#14100d)}
.hero-inner{width:100%;max-width:46rem;margin:0 auto;padding:0 1.5rem}
.teil{color:var(--acc);text-transform:uppercase;letter-spacing:.3em;font-family:system-ui,sans-serif;font-size:.9rem;margin:0 0 .5rem}
h1{font-size:clamp(2.4rem,9vw,5rem);margin:0;letter-spacing:.02em;line-height:1.1}
.tag{color:var(--mut);margin:.6rem 0 0;font-style:italic}
main{max-width:46rem;margin:0 auto;padding:1.5rem}
.gruss{font-size:1.15rem;margin:0 0 2.5rem;white-space:pre-line}
.folge{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:1.1rem 1.2rem;margin:0 0 1rem}
.folge h2{margin:0;font-size:1.25rem}
.folge p{margin:.15rem 0 0;color:var(--mut);font-family:system-ui,sans-serif;font-size:.9rem}
.btn{background:var(--acc);color:#1a1209;text-decoration:none;font-family:system-ui,sans-serif;font-weight:600;
  padding:.7rem 1.3rem;border-radius:2rem;white-space:nowrap;border:0;font-size:1rem;cursor:pointer}
footer{text-align:center;color:var(--mut);font-style:italic;padding:2.5rem 1rem calc(3rem + env(safe-area-inset-bottom,0px))}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:1.5rem;text-align:center;z-index:10}
#gate form{max-width:22rem;width:100%}
#gate h2{margin:0 0 .4rem;font-size:1.5rem}
#hinweis{color:var(--mut);font-style:italic;margin:0}
#gate input{width:100%;padding:.8rem 1rem;font-size:1.1rem;text-align:center;border-radius:.6rem;
  border:1px solid #3a322a;background:var(--card);color:var(--fg);margin:1.2rem 0 .8rem}
#fehler{color:#e07a5f;min-height:1.5em;font-family:system-ui,sans-serif;font-size:.9rem;margin:0 0 .6rem}
</style>
</head>
<body>

<div id="gate">
  <form id="form">
    <h2>Bevor es losgeht …</h2>
    <p id="hinweis"></p>
    <input id="eingabe" type="text" inputmode="numeric" placeholder="TT.MM.JJJJ" autocomplete="off">
    <p id="fehler"></p>
    <button class="btn" type="submit">Öffnen</button>
  </form>
</div>

<div id="inhalt" class="verborgen">
  <header class="hero">
    <div class="hero-inner">
      <p class="teil" id="teil"></p>
      <h1 id="titel"></h1>
      <p class="tag" id="tag"></p>
    </div>
  </header>
  <main>
    <p class="gruss" id="gruss"></p>
    <div id="folgen"></div>
  </main>
  <footer>Fortsetzung folgt :)</footer>
</div>

<script>
// ============ HIER ANPASSEN ============
var CONFIG = {
  titel: "Fery & Alena",
  teil: "Teil 2",
  tagline: "Die Fortsetzung",
  gruss: "Alles Liebe zum Geburtstag, Alena!\nDu hast „Fortsetzung folgt“ geschrieben – hier ist sie.\nDein Fery",
  // Zugangscode als Datum, z. B. "14.04.2018". Leer lassen = kein Zugangscode.
  // Hinweis: Auf einer statischen Seite ist das nur eine Spielerei, kein echter Schutz.
  zugangsdatum: "17.03.2017",
  hinweis: "Der Tag, an dem alles anfing …",
  folgen: [
    { titel: "Teil 2", zeitraum: "2018 – heute", dauer: "ca. 30 Min.", link: "HIER-VIDEO-LINK-EINFUEGEN" }
    // Bei mehreren Folgen einfach weitere Zeilen ergänzen (Komma nicht vergessen), z. B.:
    // ,{ titel: "Teil 3", zeitraum: "2021 – 2023", dauer: "ca. 10 Min.", link: "..." }
  ]
};
// =======================================

(function () {
  var c = CONFIG;
  function el(id) { return document.getElementById(id); }

  document.title = c.titel + " – " + c.teil;
  el("titel").textContent = c.titel;
  el("teil").textContent = c.teil;
  el("tag").textContent = c.tagline;
  el("gruss").textContent = c.gruss;

  c.folgen.forEach(function (f) {
    var box = document.createElement("div");
    box.className = "folge";
    var text = document.createElement("div");
    var h = document.createElement("h2");
    h.textContent = f.titel;
    var p = document.createElement("p");
    p.textContent = [f.zeitraum, f.dauer].filter(Boolean).join(" · ");
    text.appendChild(h);
    text.appendChild(p);
    var a = document.createElement("a");
    a.className = "btn";
    a.href = f.link;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "▶ Ansehen";
    box.appendChild(text);
    box.appendChild(a);
    el("folgen").appendChild(box);
  });

  function frei() {
    el("gate").classList.add("verborgen");
    el("inhalt").classList.remove("verborgen");
  }

  // "14.4.2018", "14.04.18" und "14042018" werden alle als dasselbe Datum erkannt
  function norm(s) {
    var t = String(s).split(/\D+/).filter(Boolean);
    if (t.length === 3) {
      var d = ("0" + t[0]).slice(-2), m = ("0" + t[1]).slice(-2);
      var y = t[2].length === 2 ? "20" + t[2] : t[2];
      return d + m + y;
    }
    return String(s).replace(/\D/g, "");
  }

  var richtig = norm(c.zugangsdatum);
  var schonFrei = false;
  try { schonFrei = sessionStorage.getItem("frei") === "1"; } catch (e) {}

  if (!c.zugangsdatum || schonFrei) {
    frei();
  } else {
    el("hinweis").textContent = c.hinweis;
    el("form").addEventListener("submit", function (e) {
      e.preventDefault();
      if (norm(el("eingabe").value) === richtig) {
        try { sessionStorage.setItem("frei", "1"); } catch (err) {}
        frei();
      } else {
        el("fehler").textContent = "Das stimmt leider nicht – versuch’s nochmal.";
      }
    });
  }
})();
</script>
</body>
</html>
